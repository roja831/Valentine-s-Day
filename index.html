<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Be My Valentine 💖</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
    margin:0;
    height:100vh;
    background:linear-gradient(135deg,#ff9a9e,#fad0c4);
    display:flex;
    justify-content:center;
    align-items:center;
    font-family:'Comic Sans MS', cursive;
}

.card{
    background:white;
    padding:28px;
    border-radius:20px;
    box-shadow:0 10px 30px rgba(0,0,0,0.25);
    text-align:center;
    width:88%;
    max-width:360px;
}

h1{color:#ff4d6d;}
p{font-size:18px;color:#444;}

.buttons{
    margin-top:25px;
    position:relative;
    height:140px;
    border-radius:10px;
}

button{
    padding:14px 26px;
    font-size:18px;
    border:none;
    border-radius:30px;
    position:absolute;
    cursor:pointer;
}

#yes{
    background:#ff4d6d;
    color:white;
    left:50%;
    transform:translateX(-50%);
    bottom:0;
}

#no{
    background:#ddd;
    color:#333;
    left:10px;
    top:10px;
}

#hint{
    margin-top:12px;
    color:#ff4d6d;
    display:none;
}
</style>
</head>

<body>

<div class="card" id="card">
    <h1>Hey You 💕</h1>
    <p>Will you be my Valentine? 🌹</p>

    <div class="buttons" id="box">
        <button id="yes">Yes 💖</button>
        <button id="no">No 🙈</button>
    </div>

    <div id="hint">😏 There’s a surprise if you click YES…</div>
</div>

<script>
const noBtn = document.getElementById("no");
const yesBtn = document.getElementById("yes");
const hint = document.getElementById("hint");
const card = document.getElementById("card");
const box = document.getElementById("box");

let count = 0;

// Move NO inside the box only
function moveNo(){
    count++;

    const boxRect = box.getBoundingClientRect();
    const btnRect = noBtn.getBoundingClientRect();

    const maxX = box.clientWidth - btnRect.width;
    const maxY = box.clientHeight - btnRect.height;

    const x = Math.random() * maxX;
    const y = Math.random() * maxY;

    noBtn.style.left = x + "px";
    noBtn.style.top  = y + "px";

    if(count >= 3){
        hint.style.display = "block";
    }
}

// Unlimited moves
noBtn.addEventListener("click", moveNo);
noBtn.addEventListener("touchstart", moveNo);

// YES action
yesBtn.addEventListener("click", ()=>{
    card.innerHTML = `
        <h1>💖 Surprise! 💖</h1>
        <p>
            You are the most beautiful person I have ever seen 🌹<br><br>
            Not just by looks,<br>
            but by your heart, kindness, and soul 💕<br><br>
            I’m really lucky to have you ❤️
        </p>
    `;
});
</script>

</body>
</html>
